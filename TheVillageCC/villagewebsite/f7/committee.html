<div data-name="committee" class="page">

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="navbar-inner">
            <div class="navbar-bg"></div>
            <div class="left">
                <a href="#" class="link icon-only back-button">
                    <i class="icon icon-back"></i>
                </a>
            </div>
            <div class="title">Add / Edit Committee</div>
            <div class="right">
                <a class="link icon-only" id="add-committee-button">
                    <span class="material-symbols-outlined" id="add-committee-button-icon">add</span>
                </a>
            </div>
        </div>
    </div>

    <div class="toolbar toolbar-bottom">
        <div class="toolbar-inner">
            <a href="#" class="link" id="committee-previous-year"><span class="material-symbols-outlined">chevron_left</span></a>
            <div>Year <span id="committee-current-year"></span></div>
            <a href="#" class="link" id="committee-next-year"><span class="material-symbols-outlined">chevron_right</span></a>
        </div>
    </div>

    <div class="page-content">
        <div class="list" id="committee-list">
            <ul>
            </ul>
        </div>
    </div>

    <div class="popup edit-committee-popup">
        <div class="page" id="edit-committee-page">
            <div class="navbar">
                <div class="navbar-bg"></div>
                <div class="navbar-inner">
                    <div class="left">
                        <a class="link icon-only" id="edit-committee-close-button">
                            <span class="material-symbols-outlined" id="edit-committee-close-button-icon">close</span>
                        </a>
                    </div>
                    <div class="title" id="edit-committee-title">Edit Committee Post</div>
                    <div class="right">
                        <a class="link icon-only" id="save-committee-button">
                            <span class="material-symbols-outlined" id="save-committee-button-icon">done</span>
                        </a>
                    </div>

                </div>
            </div>
            <div class="page-content">
                <div class="list inline-labels">
                    <ul>
                        <li id="committee-post-select-element">
                            <a class="item-link smart-select smart-select-init" id="committee-post-smart-select" data-open-in="popup" data-close-on-select="true">
                                <select name="committee-post" id="committee-post-select">
                                    <option value="Chair">Chair</option>
                                    <option value="Secretary">Secretary</option>
                                    <option value="Treasurer">Treasurer</option>
                                    <option value="Fixtures">Fixtures</option>
                                    <option value="Social">Social</option>
                                    <option value="Scorer">Scorer</option>
                                    <option value="Other">Other</option>
                                </select>
                                <div class="item-content">
                                    <div class="item-inner">
                                        <div class="item-title">Post</div>
                                    </div>
                                </div>
                            </a>
                            <div class="item-content item-input mt-1" id="committee-post-other-element" style="padding:0 16px; display:none;">
                                <div class="item-inner">
                                    <div class="item-input-wrap">
                                        <input type="text" placeholder="Other post" id="committee-post-other-input" />
                                    </div>
                                </div>
                            </div>
                        </li>
                        <li id="committee-player-select-element">
                            <a class="item-link smart-select smart-select-init" id="committee-player-smart-select" data-open-in="popup" data-close-on-select="true">
                                <select name="player" id="committee-player-select">
                                    <option value="-1">Please select...</option>
                                </select>
                                <div class="item-content">
                                    <div class="item-inner">
                                        <div class="item-title">Player</div>
                                    </div>
                                </div>
                            </a>
                        </li>
                        <li class="item-content item-input" id="committee-year-element">
                            <div class="item-inner">
                                <div class="item-title item-label">Year</div>
                                <div class="item-input-wrap">
                                    <input type="number" placeholder="Year" id="committee-year-input" />
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>

            </div>

        </div>
    </div>

</div>
